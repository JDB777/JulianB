<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>WordFall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loading-screen">
    <div id="loading-inner">
      <div id="loading-title">WORDFALL</div>
      <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
      <div id="loading-label">SPELL 3 WORDS IN 90 SECONDS!</div>
    </div>
  </div>

  <div id="app" class="hidden">

    <!-- Row 1: [pause | timer] | title | words -->
    <header id="hdr">
      <div id="hdr-left">
        <button id="btn-pause" class="ctrl-btn" aria-label="Pause">&#9646;&#9646;</button>
        <div class="hdr-col">
          <div id="timer">1:30</div>
          <div class="stat-label">TIME</div>
        </div>
      </div>
      <h1 id="title">WORDFALL</h1>
      <div class="hdr-col hdr-right">
        <div id="words-counter">0/3</div>
        <div class="stat-label">WORDS</div>
      </div>
    </header>

    <!-- Row 2: score | next letter -->
    <div id="sub-bar">
      <div id="score-block">
        <div class="stat-label">SCORE</div>
        <div id="score">0</div>
      </div>
      <div id="next-block">
        <div class="stat-label">NEXT</div>
        <div id="next-letter"></div>
      </div>
    </div>

    <div id="board-wrap">
      <div id="word-list"></div>
      <div id="board-area">
        <div id="board"></div>
        <div id="pause-overlay" class="hidden">
          <div id="pause-text">
            <div class="pause-title">PAUSED</div>
            <div id="letter-grid">
              <span>A<small>1</small></span><span>B<small>3</small></span><span>C<small>3</small></span><span>D<small>2</small></span><span>E<small>1</small></span>
              <span>F<small>4</small></span><span>G<small>2</small></span><span>H<small>4</small></span><span>I<small>1</small></span><span>J<small>8</small></span>
              <span>K<small>5</small></span><span>L<small>1</small></span><span>M<small>3</small></span><span>N<small>1</small></span><span>O<small>1</small></span>
              <span>P<small>3</small></span><span>Q<small>10</small></span><span>R<small>1</small></span><span>S<small>1</small></span><span>T<small>1</small></span>
              <span>U<small>1</small></span><span>V<small>4</small></span><span>W<small>4</small></span><span>X<small>8</small></span><span>Y<small>4</small></span>
              <span>Z<small>10</small></span>
            </div>
          </div>
        </div>
        <div id="modal-overlay" class="hidden">
          <h2 id="result-heading">GAME OVER</h2>
          <p  id="result-sub"></p>
          <div id="final-stats">
            <div class="stat-row"><span>SCORE</span>         <strong id="final-score">0</strong></div>
            <div class="stat-row"><span>TIME USED</span>     <strong id="final-time">—</strong></div>
            <div class="stat-row"><span>WORDS SPELLED</span> <strong id="final-count">0/3</strong></div>
            <div class="stat-row"><span>LONGEST WORD</span>  <strong id="final-word">—</strong></div>
          </div>
          <div id="modal-words-section">
            <div class="stat-label" style="letter-spacing:2px;">WORDS SPELLED</div>
            <div id="modal-words"></div>
          </div>
          <div id="name-section">
            <input id="player-name" type="text" maxlength="12" placeholder="YOUR NAME"
                   autocomplete="off" autocorrect="off" spellcheck="false">
            <button id="btn-submit">SAVE</button>
          </div>
          <div id="lb-section">
            <div id="lb-title">TOP SCORES</div>
            <ol id="scores-list"></ol>
          </div>
          <button id="btn-restart">PLAY AGAIN</button>
        </div>
      </div>
    </div>

    <div id="last-word-row">
      <span id="last-word"></span>
    </div>

    <footer id="ftr">
      <div id="controls">
        <button id="btn-left"  class="ctrl-btn" aria-label="Move left">&#9664;</button>
        <button id="btn-down"  class="ctrl-btn" aria-label="Drop faster">&#9660;</button>
        <button id="btn-right" class="ctrl-btn" aria-label="Move right">&#9654;</button>
      </div>
    </footer>

  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
